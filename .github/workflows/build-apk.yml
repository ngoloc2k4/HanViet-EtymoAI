name: Build & Release Android APK

on:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'
      - 'v*.*.*-beta*'
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'project-meta/**'
  workflow_dispatch:
    inputs:
      release_channel:
        description: 'Release Channel'
        required: true
        type: choice
        options:
          - beta
          - stable
        default: 'beta'
      is_prerelease:
        description: 'Mark as Pre-release (Beta)?'
        required: true
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ==========================================================================
  # GIAI ĐOẠN 1: TEST TRƯỚC KHI BUILD (FAIL-FAST QUALITY GATE)
  # ==========================================================================
  test-and-lint:
    name: Lint & Unit Tests Quality Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Eclipse Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK & Build Tools
        uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;35.0.0 platforms;android-35'

      - name: Cache Shared Gradle Packages & Wrapper
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Restore Robolectric Offline Dependency Cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: ${{ runner.os }}-robolectric-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-robolectric-

      - name: Set up Gradle Environment
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x gradlew

      - name: Run Linter and Unit Tests
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true"
        run: |
          ./gradlew lintDebug testDebugUnitTest --continue --build-cache --parallel

      - name: Upload Test Results (JUnit & Lint)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-lint-reports-apk
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results*.html
          retention-days: 7

  # ==========================================================================
  # GIAI ĐOẠN 2: BUILD, SIGN VÀ AUTO RELEASE BETA APK
  # ==========================================================================
  build-and-release:
    name: Build, Sign & Release APK
    needs: [test-and-lint]  # BẮT BUỘC: Chỉ build khi test-and-lint thành công 100%
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write       # Cần thiết để tạo GitHub Release và upload assets

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17 (Eclipse Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK & Build Tools
        uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;35.0.0 platforms;android-35'

      - name: Cache Shared Gradle Packages & Wrapper
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Set up Gradle Environment
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x gradlew

      - name: Assemble Release APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true"
        run: |
          ./gradlew assembleRelease --build-cache --parallel

      # ----------------------------------------------------------------------
      # BẢO MẬT & KÝ SỐ APK (APK SIGNATURE SECRETS)
      # ----------------------------------------------------------------------
      - name: Sign & Align Release APK
        id: sign-apk
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          RELEASE_DIR="app/build/outputs/apk/release"
          UNSIGNED_APK=$(find "$RELEASE_DIR" -name "*.apk" | head -n 1)

          # Tên file phát hành chính thức
          VERSION_TAG="${{ github.ref_name }}"
          if [ "$VERSION_TAG" = "main" ]; then
            OUTPUT_APK_NAME="HanVietEtymoAI-beta-b${{ github.run_number }}.apk"
          else
            OUTPUT_APK_NAME="HanVietEtymoAI-${VERSION_TAG}.apk"
          fi
          OUTPUT_APK_PATH="${RELEASE_DIR}/${OUTPUT_APK_NAME}"

          echo "[INFO] Xác định đường dẫn Android Build Tools..."
          BUILD_TOOLS_DIR=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -maxdepth 1 -mindepth 1 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$BUILD_TOOLS_DIR" ]; then
            export PATH="$BUILD_TOOLS_DIR:$PATH"
          fi

          KEYSTORE_FILE="/tmp/release.keystore"
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ]; then
            echo "[INFO] Đang giải mã production keystore từ GitHub Secrets..."
            echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_FILE"
            chmod 600 "$KEYSTORE_FILE"
            STORE_PASS="$KEYSTORE_PASSWORD"
            ALIAS="$KEY_ALIAS"
            KEY_PASS="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          else
            echo "[WARN] Không tìm thấy GitHub Secrets cho Keystore. Tự động sinh Keystore dự phòng để đảm bảo APK luôn được ký số hợp lệ!"
            STORE_PASS="fallbackReleasePass2026!"
            ALIAS="fallback-release-key"
            KEY_PASS="$STORE_PASS"
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_FILE" \
              -alias "$ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$STORE_PASS" \
              -keypass "$KEY_PASS" \
              -dname "CN=HanVietEtymoAI Fallback, OU=Mobile, O=OpenSource, L=Hanoi, ST=Hanoi, C=VN"
            chmod 600 "$KEYSTORE_FILE"
          fi

          echo "[INFO] Thực hiện zipalign (4-byte alignment)..."
          ALIGNED_APK="/tmp/aligned.apk"
          if command -v zipalign >/dev/null 2>&1; then
            zipalign -v -p 4 "$UNSIGNED_APK" "$ALIGNED_APK"
          else
            cp "$UNSIGNED_APK" "$ALIGNED_APK"
          fi

          echo "[INFO] Ký số APK bằng apksigner (hỗ trợ đầy đủ scheme v1 + v2 + v3 cho Android 8.0+)..."
          apksigner sign \
            --ks "$KEYSTORE_FILE" \
            --ks-key-alias "$ALIAS" \
            --ks-pass "pass:$STORE_PASS" \
            --key-pass "pass:$KEY_PASS" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$OUTPUT_APK_PATH" \
            "$ALIGNED_APK"

          echo "[INFO] Kiểm chứng chữ ký APK:"
          apksigner verify --verbose "$OUTPUT_APK_PATH"

          echo "apk_name=${OUTPUT_APK_NAME}" >> "$GITHUB_OUTPUT"
          echo "apk_path=${OUTPUT_APK_PATH}" >> "$GITHUB_OUTPUT"

      - name: Secure Cleanup Keystore File
        if: always()
        run: |
          if [ -f "/tmp/release.keystore" ]; then
            shred -u /tmp/release.keystore 2>/dev/null || rm -f /tmp/release.keystore
            echo "[INFO] Đã hủy file keystore tạm an toàn."
          fi

      # ----------------------------------------------------------------------
      # TÍNH TOÁN SHA-256 CHECKSUM
      # ----------------------------------------------------------------------
      - name: Generate SHA-256 Integrity Checksum
        id: checksum
        env:
          APK_PATH: ${{ steps.sign-apk.outputs.apk_path }}
          APK_NAME: ${{ steps.sign-apk.outputs.apk_name }}
        run: |
          cd $(dirname "$APK_PATH")
          sha256sum "$APK_NAME" > "${APK_NAME}.sha256"
          cat "${APK_NAME}.sha256"
          echo "checksum_path=$(dirname "$APK_PATH")/${APK_NAME}.sha256" >> "$GITHUB_OUTPUT"

      - name: Upload Signed APK to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.sign-apk.outputs.apk_name }}
          path: |
            ${{ steps.sign-apk.outputs.apk_path }}
            ${{ steps.checksum.outputs.checksum_path }}
          retention-days: 14

      # ----------------------------------------------------------------------
      # AUTO RELEASE BETA APK LÊN GITHUB RELEASES
      # ----------------------------------------------------------------------
      - name: Publish Beta Release to GitHub Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APK_PATH: ${{ steps.sign-apk.outputs.apk_path }}
          CHECKSUM_PATH: ${{ steps.checksum.outputs.checksum_path }}
          APK_NAME: ${{ steps.sign-apk.outputs.apk_name }}
          INPUT_PRERELEASE: ${{ github.event.inputs.is_prerelease }}
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            RELEASE_TAG="beta-latest"
            RELEASE_TITLE="HanViet-EtymoAI Beta (Build #${{ github.run_number }})"
          else
            RELEASE_TAG="${{ github.ref_name }}"
            RELEASE_TITLE="HanViet-EtymoAI Release ${RELEASE_TAG}"
          fi

          PRERELEASE_FLAG=""
          if [ "$INPUT_PRERELEASE" = "true" ] || [ "${{ github.ref_name }}" = "main" ] || [[ "${{ github.ref_name }}" == *"beta"* ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          echo "[INFO] Chuẩn bị release notes..."
          {
            echo "### 🚀 HanViet-EtymoAI Automated Build"
            echo ""
            echo "- **APK File**: \`${APK_NAME}\`"
            echo "- **Commit**: \`${{ github.sha }}\`"
            echo "- **Build Number**: \`#${{ github.run_number }}\`"
            echo "- **Chất Lượng**: Đã vượt qua Quality Gate (Lint & Unit Tests)."
            echo "- **Hỗ trợ thiết bị**: Android 8.0+ (API 26+)"
            echo ""
            echo "#### 🔒 SHA-256 Checksum:"
            echo "\`\`\`"
            cat "$CHECKSUM_PATH"
            echo "\`\`\`"
            echo ""
            echo "> *Bản phát hành được tự động đóng gói, ký số và kiểm tra toàn vẹn bởi GitHub Actions CI/CD.*"
          } > /tmp/release_notes.md

          echo "[INFO] Đang tạo hoặc cập nhật GitHub Release: ${RELEASE_TAG}..."
          if [ "$RELEASE_TAG" = "beta-latest" ]; then
            gh release delete "$RELEASE_TAG" --yes --cleanup-tag 2>/dev/null || true
          fi

          gh release create "$RELEASE_TAG" \
            "$APK_PATH" \
            "$CHECKSUM_PATH" \
            --target "${{ github.sha }}" \
            --title "$RELEASE_TITLE" \
            --notes-file /tmp/release_notes.md \
            $PRERELEASE_FLAG
